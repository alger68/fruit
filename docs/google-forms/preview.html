<title>Global AR 問卷預覽</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a form-shaped column on a tinted ground, a sticky step bar above it, a notes panel below. */
:root {
  --bg: #eef2f1;
  --surface: #ffffff;
  --fg: #1d2b2a;
  --muted: #5d6f6d;
  --line: #d3dcda;
  --accent: #0f766e;
  --accent-soft: #d9efeb;
  --warn: #b4351f;
  --font-body: "Noto Sans TC", system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1716; --surface: #18221f; --fg: #e4eeec; --muted: #9bb0ad; --line: #2b3b38;
    --accent: #4fd1c0; --accent-soft: #163a35; --warn: #ff8f78; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1716; --surface: #18221f; --fg: #e4eeec; --muted: #9bb0ad; --line: #2b3b38;
  --accent: #4fd1c0; --accent-soft: #163a35; --warn: #ff8f78; color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); line-height: 1.6; }
.wrap { max-width: 720px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 56px; }
h1 { font-size: 1.5rem; line-height: 1.3; margin: 0 0 6px; text-wrap: balance; }
.lead { color: var(--muted); margin: 0 0 16px; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px; display: grid; gap: 10px; }
.who { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 0.875rem; }
.who span { color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; color: var(--fg); font: inherit; font-size: 0.875rem; padding: 6px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.steps { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.steps button { flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: inherit; font-size: 0.8125rem; padding: 6px 10px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
.steps button[aria-current="step"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 700; }
.steps button[hidden] { display: none; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.page-title { margin: 18px 0 4px; font-size: 1.125rem; border-bottom: 3px solid var(--accent); padding-bottom: 8px; }
.note { font-size: 0.875rem; color: var(--muted); margin: 8px 0 14px; }
.branch { border: 1px dashed var(--accent); background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; font-size: 0.875rem; margin: 10px 0 14px; }
.q { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 12px; }
.q h3 { font-size: 1rem; font-weight: 500; margin: 0 0 10px; }
.q .id { font-family: var(--font-mono); font-size: 0.8125rem; color: var(--muted); margin-right: 6px; }
.q .req { color: var(--warn); margin-left: 4px; }
.opt { display: flex; align-items: flex-start; gap: 10px; padding: 5px 0; cursor: pointer; }
.opt input { margin-top: 5px; accent-color: var(--accent); flex: none; }
.opt .other-line { flex: 1; min-width: 0; border-bottom: 1px solid var(--line); height: 1.4em; }
.tag { display: inline-block; font-size: 0.75rem; border: 1px solid var(--line); border-radius: 99px; padding: 0 8px; color: var(--muted); margin-left: 6px; }
.text-q { border-bottom: 1px solid var(--line); height: 2em; color: var(--muted); font-size: 0.875rem; }
.nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 16px; }
.nav button { font: inherit; border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 8px 18px; border-radius: 8px; cursor: pointer; }
.nav button.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.nav button:disabled { opacity: 0.4; cursor: default; }
.how { margin-top: 28px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
.how h2 { font-size: 1rem; margin: 0 0 8px; }
.how ol { margin: 0; padding-left: 1.25em; }
.how li { margin-bottom: 4px; }
.how code { font-family: var(--font-mono); font-size: 0.8125rem; background: var(--accent-soft); padding: 1px 5px; border-radius: 4px; }
</style>

<div class="wrap">

    </ol>
  </div>
</div>

<script>
var DATA = {"description": "為建立一致的全球應收帳款(AR)作業標準,請協助填寫本問卷。全部為選擇題,約需 20 至 30 分鐘。標 * 為必填。若選項無法描述貴單位的做法,請選「其他」並簡短說明。\n\nTo establish consistent global accounts receivable (AR) standards, please complete this survey. All questions are multiple choice and take about 20 to 30 minutes. Questions marked * are required. If no option describes your practice, choose \"Other\" and add a short note.", "profile": [{"id": "P1", "text": "夥伴代碼(請填寫總部提供的代碼) / Partner code (please enter the code provided by HQ)", "required": true}, {"id": "P2", "text": "公司名稱 / Company name", "required": true}, {"id": "P3", "text": "國家 / 地區 / Country / region", "required": true}, {"id": "P4", "text": "聯絡 Email(選填,供補問使用) / Contact email (optional, for follow-up)", "required": false}], "questions": [{"id": "R0", "section": "0. 分流(新增)", "text": "貴單位屬於哪一類? / Which type of entity are you?", "multi": false, "options": ["子公司 / 合資公司(例如 YMA、YMC) / Subsidiary / joint venture (e.g., YMA, YMC)", "代理行(Agent)"], "other": false, "required": true, "subOnly": false}, {"id": "A1", "section": "A. 基本資料及作業範圍 / A. Basic Information and Scope of Operations", "text": "前端收款作業涵蓋哪些項目? / Which items does front-end collection cover?", "multi": true, "options": ["進口運費 / Import freight", "出口運費 / Export freight", "Manifest Charge", "Non-Manifest Charge", "Local Charge", "非運費收入 / Non-freight income", "第三地付款 / Third-location payments"], "other": true, "required": true, "subOnly": true}, {"id": "A2", "section": "A. 基本資料及作業範圍 / A. Basic Information and Scope of Operations", "text": "進口與出口的收款作業,在地與 ICBO 如何分工? / How are import and export collection tasks divided between the local office and ICBO?", "multi": false, "options": ["全部由在地處理 / All handled locally", "收款在地、銷帳由 ICBO 集中處理 / Collection handled locally and cash application handled centrally by ICBO", "收款與銷帳皆由 ICBO 集中,在地僅聯繫客戶 / Both collection and cash application handled centrally by ICBO and the local office only contacts customers", "進口與出口分工不同 / Import and export are divided differently"], "other": true, "required": true, "subOnly": true}, {"id": "A3", "section": "A. 基本資料及作業範圍 / A. Basic Information and Scope of Operations", "text": "收款與銷帳由哪些單位負責? / Which units handle collection and cash application?", "multi": true, "options": ["YMA-NJ", "LAX office", "ICBO-DSA", "ICBO-NSA", "HSC"], "other": true, "required": true, "subOnly": true}, {"id": "A4", "section": "A. 基本資料及作業範圍 / A. Basic Information and Scope of Operations", "text": "日班與夜班如何分工及交接? / How are day and night shifts divided, and how are open cases handed over?", "multi": false, "options": ["無日夜班分工 / No day / night shift split", "有分工,書面交接並以系統追蹤 / Split by shift with written handover tracked in the system", "有分工,僅以 Email / 口頭交接 / Split by shift with handover by email or verbally only", "有分工,無交接機制 / Split by shift with no handover process"], "other": false, "required": true, "subOnly": true}, {"id": "A5", "section": "A. 基本資料及作業範圍 / A. Basic Information and Scope of Operations", "text": "每月帳單數約為多少? / About how many invoices are issued per month?", "multi": false, "options": ["未滿 500 / Under 500", "500–2,000", "2,001–5,000", "5,001–10,000", "10,001–50,000", "超過 50,000 / Over 50,000"], "other": false, "required": false, "subOnly": true}, {"id": "A6", "section": "A. 基本資料及作業範圍 / A. Basic Information and Scope of Operations", "text": "每月收款及銷帳筆數約為多少? / About how many receipts and cash applications are there per month?", "multi": false, "options": ["未滿 500 / Under 500", "500–2,000", "2,001–5,000", "5,001–10,000", "10,001–50,000", "超過 50,000 / Over 50,000"], "other": false, "required": false, "subOnly": true}, {"id": "A7", "section": "A. 基本資料及作業範圍 / A. Basic Information and Scope of Operations", "text": "目前 Outstanding 金額(USD)約為多少? / What is the current outstanding amount (USD)?", "multi": false, "options": ["未滿 100 萬 / Under USD 1 million", "100–500 萬 / USD 1–5 million", "501–1,000 萬 / USD 5.01–10 million", "1,001–5,000 萬 / USD 10.01–50 million", "超過 5,000 萬 / Over USD 50 million"], "other": false, "required": false, "subOnly": true}, {"id": "B1", "section": "B. 應收帳款及帳單開立 / B. Receivables and Invoice Issuance", "text": "應收帳款於哪一個作業時點成立? / At which point in the process is a receivable established?", "multi": false, "options": ["訂艙 / Booking", "開船 / Sailing", "到港 / Arrival", "Arrival Notice", "提單 / Bill of lading", "Draft", "Invoice / Due Bill 開立時 / When the invoice / due bill is issued"], "other": true, "required": true, "subOnly": false}, {"id": "B2", "section": "B. 應收帳款及帳單開立 / B. Receivables and Invoice Issuance", "text": "應收帳款資料來源(含 Manifest 與 Non-Manifest / Local Charge 建檔)使用哪些系統? / Which systems hold receivable data (including Manifest and Non-Manifest / Local Charge records)?", "multi": true, "options": ["AFSYS", "ILIS", "YMGA", "Web AR", "Local System(當地系統)", "ICES/FRNA", "Excel", "人工輸入 / Manual entry"], "other": true, "required": true, "subOnly": false}, {"id": "B3", "section": "B. 應收帳款及帳單開立 / B. Receivables and Invoice Issuance", "text": "發票 / 帳單依何種層級開立? / At what level are invoices / billing statements issued?", "multi": false, "options": ["客戶別 / By customer", "航次別 / By voyage", "提單別 / By bill of lading", "客戶別 + 航次別 / By customer and voyage"], "other": true, "required": true, "subOnly": false}, {"id": "B4", "section": "B. 應收帳款及帳單開立 / B. Receivables and Invoice Issuance", "text": "進口與出口的發票 / 帳單,由誰、以何種方式開立? / For import and export invoices / billing statements, who issues them and how?", "multi": false, "options": ["在地以系統自動產出 / Local office with system-generated output", "在地以 Excel / 手工開立 / Local office with Excel / manual preparation", "ICBO 集中開立 / Issued centrally by ICBO", "進口與出口方式不同 / Import and export differ"], "other": true, "required": true, "subOnly": false}, {"id": "B5", "section": "B. 應收帳款及帳單開立 / B. Receivables and Invoice Issuance", "text": "帳單是否有獨立編號?若無,以什麼作為辨識及付款依據? / Does the billing statement have its own invoice number? If not, what identifies it for payment?", "multi": false, "options": ["有獨立發票編號 / Yes", "無,以 Arrival Notice(A/N)代替 / No and the Arrival Notice (A/N) is used instead", "無,以 B/L copy 代替 / No and a B/L copy is used instead", "無,以 B/L No. 或 Booking No. / No and the B/L No. or Booking No. is used"], "other": true, "required": true, "subOnly": false}, {"id": "B6", "section": "B. 應收帳款及帳單開立 / B. Receivables and Invoice Issuance", "text": "Due Date(含授信客戶)如何計算? / How is the due date calculated (including for credit customers)?", "multi": true, "options": ["依合約約定 / Per contract", "Invoice Date 加天數 / Invoice date plus days", "開船日加天數 / Sailing date plus days", "到港日加天數 / Arrival date plus days", "月結 / Monthly statement", "人工設定 / Set manually"], "other": true, "required": true, "subOnly": false}, {"id": "B7", "section": "B. 應收帳款及帳單開立 / B. Receivables and Invoice Issuance", "text": "帳單修改、重開或作廢時,是否保留原始資料及異動紀錄? / When an invoice is amended, reissued or voided, are the original data and change history kept?", "multi": false, "options": ["系統自動完整保留 / Kept in full by the system", "僅保留最新版本 / Only the latest version is kept", "以 Excel / Email 記錄 / Recorded in Excel / email", "無紀錄 / No record"], "other": false, "required": true, "subOnly": false}, {"id": "B8", "section": "B. 應收帳款及帳單開立 / B. Receivables and Invoice Issuance", "text": "是否使用 Payment Center 傳輸發票及查詢付款狀態? / Do you use Payment Center to transmit invoices and check payment status?", "multi": false, "options": ["全面使用(自動傳輸及查詢) / Fully (automatic transmission and inquiry)", "部分客戶使用 / For some customers", "不使用 / Not used"], "other": false, "required": false, "subOnly": false}, {"id": "B9", "section": "B. 應收帳款及帳單開立 / B. Receivables and Invoice Issuance", "text": "Non-Manifest / Local Charge 等特殊費用的開立及收款流程為何? / How are special charges such as Non-Manifest / Local Charge issued and collected?", "multi": false, "options": ["與運費相同 / Same as freight", "另行開立,收款流程相同 / Issued separately and collected the same way", "開立與收款皆為獨立流程 / Issued and collected through separate processes"], "other": true, "required": false, "subOnly": false}, {"id": "B10", "section": "B. 應收帳款及     out += '<h2 class="page-title">第 1 頁:基本資料與身份</h2>';
    DATA.profile.forEach(function (p) {
      out += '<div class="q"><h3><span class="id">' + p.id + '</span>' + esc(p.text) + (p.required ? '<span class="req">*</span>' : '') + '</h3><div class="text-q">簡答文字</div></div>';
    });
    out += qHtml(R0);
    out += '<div class="branch"><strong>分支設定:</strong>選「' + esc(R0.options[0]) + '」前往 A 區(第 2 頁);選「' + esc(R0.options[1]) + '」直接前往 B 區(第 3 頁)。</div>';
  } else {
    var name = pageNames[cur - 1];
    out += '<h2 class="page-title">第 ' + (pages.indexOf(cur) + 1 + (isSub ? 0 : 0)) + ' 頁:' + esc(name) + '</h2>';
    if (name.indexOf("A.") === 0) out += '<p class="note">僅「子公司 / 合資」會看到這一頁。</p>';
    QS.filter(function (q) { return q.section === name; }).forEach(function (q) { out += qHtml(q); });
  }
  document.getElementById("page").innerHTML = out;
  document.getElementById("prev").disabled = pos === 0;
  var nx = document.getElementById("next");
  nx.textContent = pos === pages.length - 1 ? "提交(預覽)" : "下一頁";
  nx.disabled = pos === pages.length - 1;
}

document.getElementById("desc").textContent = DATA.description;
document.getElementById("who-sub").onclick = function () { isSub = true; render(); };
document.getElementById("who-agent").onclick = function () { isSub = false; render(); };
document.getElementById("prev").onclick = function () { var p = visiblePages(); cur = p[p.indexOf(cur) - 1]; render(); window.scrollTo(0, 0); };
document.getElementById("next").onclick = function () { var p = visiblePages(); cur = p[p.indexOf(cur) + 1]; render(); window.scrollTo(0, 0); };
render();
</script>
